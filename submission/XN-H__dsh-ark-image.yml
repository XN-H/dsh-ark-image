url: https://github.com/XN-H/dsh-ark-image
name: XN-H/dsh-ark-image
category: tools
description:
  en: 'Registers one tool (ark_generate_image) that generates images through Volcano Ark''s native Seedream API. The Ark URL is built in, so only an API key is required - no base URL to configure. Images are downloaded and saved into the session workspace immediately, because Ark URLs expire, and are then shown inline in the conversation. Zero dependencies, plain JavaScript, no build step.'
  zh: '注册一个工具（ark_generate_image），通过火山方舟原生 Seedream API 生成图片。接口地址已内置，只需填 API Key，无需配置 baseURL。生成后立刻下载并保存到会话工作区（方舟返回的链接会过期），并在对话中直接显示。零依赖、纯 JavaScript、无构建步骤。'
